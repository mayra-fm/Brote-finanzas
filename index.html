<style>
:root{
  --paper:#F4EEE3; --paper-2:#ECE3D3; --ink:#2A2233; --ink-soft:#6b6178;
  --mauve:#9C5D74; --mauve-deep:#7A4359; --sage:#727F62; --sage-deep:#566049;
  --ochre:#C08A3E; --rust:#B25644; --teal:#2C4A5A; --line:rgba(42,34,51,0.12); --card:#FBF8F1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);
  background-image:radial-gradient(circle at 8% 0%, rgba(156,93,116,0.10), transparent 40%),
                   radial-gradient(circle at 92% 18%, rgba(114,127,98,0.10), transparent 38%);
  color:var(--ink); font-family:'Manrope',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
.wrap{max-width:480px;margin:0 auto;padding:0 0 96px 0;min-height:100vh;position:relative;}
button,input,select,textarea{font-family:inherit;}
header.top{padding:20px 20px 8px;display:flex;align-items:baseline;justify-content:space-between;}
.mark{font-family:'Fraunces',serif;font-weight:600;font-size:23px;display:flex;align-items:center;gap:7px;}
.mark svg{width:20px;height:20px;}
.date-pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:5px 10px;}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(251,248,241,0.95);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);max-width:480px;margin:0 auto;}
nav.tabs .row{display:flex;}
nav.tabs button{flex:1;background:none;border:none;padding:10px 4px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-weight:700;font-size:10px;}
nav.tabs button svg{width:19px;height:19px;opacity:.7;}
nav.tabs button.active{color:var(--mauve-deep);} nav.tabs button.active svg{opacity:1;}
.fab{position:fixed;bottom:74px;right:calc(50% - 240px + 16px);z-index:50;width:54px;height:54px;
  border-radius:50%;border:none;cursor:pointer;background:var(--mauve);color:#fff;
  box-shadow:0 6px 20px rgba(122,67,89,.42);display:flex;align-items:center;justify-content:center;}
.fab svg{width:24px;height:24px;}
@media (max-width:520px){.fab{right:16px;}}
section.view{padding:2px 18px 22px;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.view-head{display:flex;align-items:center;gap:10px;margin:4px 0 14px;}
.back-btn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 13px;
  color:var(--ink);font-weight:700;font-size:12px;cursor:pointer;}
.view-head h1{font-family:'Fraunces',serif;font-size:18px;font-weight:500;margin:0;flex:1;}
h2.section-title{font-family:'Fraunces',serif;font-weight:500;font-size:15px;margin:20px 0 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
.card+.card{margin-top:10px;}
.hero-card{background:linear-gradient(155deg,#33253A 0%,#4A3049 55%,#6b3d4c 100%);color:#F4EEE3;
  border-radius:20px;padding:20px 18px;position:relative;overflow:hidden;}
.hero-card::after{content:'';position:absolute;right:-30px;top:-30px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(192,138,62,.35),transparent 70%);}
.hero-card .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;}
.hero-card .amount{font-family:'Fraunces',serif;font-size:35px;font-weight:500;margin:4px 0 2px;}
.hero-card .amount.neg{color:#F0B8A8;}
.hero-card .sub{font-size:12px;opacity:.85;}
.hero-mini{display:flex;gap:14px;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap;}
.hero-mini .m{font-size:11px;opacity:.85;}
.hero-mini .m b{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;opacity:1;margin-top:2px;}
.bar-track{height:8px;border-radius:6px;background:rgba(244,238,227,.18);overflow:hidden;display:flex;margin-top:14px;position:relative;z-index:1;}
.bar-seg{height:100%;}
.bar-seg.fijo{background:#8E90C4;} .bar-seg.prest{background:#C08A3E;} .bar-seg.var{background:#E3B872;}
.bar-key{display:flex;gap:12px;margin-top:7px;font-size:10px;opacity:.8;position:relative;z-index:1;flex-wrap:wrap;}
.bar-key i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;}
.alert-card{border-radius:14px;padding:12px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;margin-top:10px;}
.alert-card.warn{background:#F6E5D6;color:#7A4E1F;}
.alert-card.info{background:#E1E6D8;color:#3E4A32;}
.alert-card svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px;}
.hub-tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;
  cursor:pointer;text-align:left;transition:transform .1s;position:relative;}
.hub-tile:active{transform:scale(.98);}
.hub-tile .th{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.hub-tile .th svg{width:13px;height:13px;}
.hub-tile .tv{font-family:'Fraunces',serif;font-size:18px;font-weight:500;margin-top:5px;}
.hub-tile .ts{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.hub-tile.wide{grid-column:1 / -1;}
.mode-switch{display:flex;gap:5px;background:var(--paper-2);padding:4px;border-radius:13px;margin:4px 0 12px;}
.mode-btn{flex:1;border:none;background:none;border-radius:9px;padding:8px 5px;cursor:pointer;font-weight:700;font-size:11.5px;color:var(--ink-soft);}
.mode-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(42,34,51,.1);}
select.month-select{font-weight:700;font-size:12px;color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:6px 11px;}
.txn-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.txn-row:last-child{border-bottom:none;}
.txn-dot{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.txn-info{flex:1;min-width:0;}
.txn-name{font-weight:700;font-size:13.5px;}
.txn-meta{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.txn-amt{text-align:right;font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:500;white-space:nowrap;}
.txn-amt.pos{color:var(--sage-deep);}
.txn-amt .eq{display:block;font-size:9.5px;color:var(--ink-soft);font-weight:400;}
.day-hdr{font-size:10.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 4px;}
.day-hdr:first-child{margin-top:4px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
.chip.fijo{background:#E1E2EF;color:#4A4C7A;}
.chip.var{background:#F6E5D6;color:#8A5A1F;}
.chip.prest{background:#EFE3CC;color:#7A5A1F;}
.chip.ing{background:#E1E6D8;color:#3E4A32;}
.chip.ct{background:#DEE9EC;color:#2C4A56;}
.empty{text-align:center;padding:36px 16px;color:var(--ink-soft);font-size:13px;}
.empty svg{width:32px;height:32px;opacity:.4;margin-bottom:8px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:13px;
  padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;width:100%;}
.btn.primary{background:var(--mauve);color:#fff;}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:#F4E0DA;color:#8A3E28;}
.btn.sm{padding:8px 12px;font-size:12px;width:auto;}
label.field{display:block;margin-top:12px;}
label.field .lt{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:block;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:13.5px;
  background:var(--card);color:var(--ink);}
textarea{resize:vertical;min-height:60px;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 6px;
  font-weight:700;font-size:12px;color:var(--ink-soft);cursor:pointer;}
.seg button.active{background:var(--mauve);color:#fff;border-color:var(--mauve);}
.sheet-overlay{position:fixed;inset:0;background:rgba(42,34,51,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--paper);width:100%;max-width:480px;border-radius:22px 22px 0 0;max-height:88vh;
  overflow-y:auto;padding:8px 18px 26px;animation:up .2s ease;}
@keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:8px auto 14px;}
.sheet h2{font-family:'Fraunces',serif;font-weight:500;font-size:17px;margin:0 0 12px;}
.close-x{position:absolute;top:14px;right:16px;background:var(--card);border:1px solid var(--line);
  border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
.close-x svg{width:14px;height:14px;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:20px;font-size:12.5px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.progress-mini{height:6px;background:var(--paper-2);border-radius:6px;overflow:hidden;margin-top:6px;}
.progress-mini i{display:block;height:100%;background:var(--sage);border-radius:6px;}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.cat-swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0;}
.cat-bar-track{flex:1;height:7px;background:var(--paper-2);border-radius:5px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.foto-drop{margin-top:12px;border:1.5px dashed var(--line);border-radius:16px;padding:22px 14px;text-align:center;cursor:pointer;}
.foto-drop svg{width:24px;height:24px;margin-bottom:6px;opacity:.6;}
.foto-drop .t{font-weight:700;font-size:13px;}
.foto-drop .s{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.voz-box{margin-top:16px;text-align:center;padding:20px 14px;background:var(--card);border-radius:16px;border:1px solid var(--line);}
.voz-btn{width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;background:var(--mauve);color:#fff;display:inline-flex;align-items:center;justify-content:center;}
.voz-btn.rec{background:var(--rust);animation:pulse 1.1s infinite;}
.voz-btn svg{width:26px;height:26px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(178,86,68,.5);}70%{box-shadow:0 0 0 14px rgba(178,86,68,0);}100%{box-shadow:0 0 0 0 rgba(178,86,68,0);}}
.voz-t{font-family:'Fraunces',serif;font-size:15px;margin-top:12px;}
.voz-s{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg);}}
::-webkit-scrollbar{width:0;height:0;}
.cloud-lock{position:fixed;inset:0;z-index:200;background:linear-gradient(155deg,#33253A 0%,#4A3049 55%,#6b3d4c 100%);

.cloud-lock .box{max-width:340px;width:100%;text-align:center;color:#F4EEE3;}
.cloud-lock .mark{font-family:'Fraunces',serif;font-weight:600;font-size:30px;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:6px;}

.cloud-lock p{font-size:13.5px;opacity:.85;line-height:1.5;margin:10px 0 22px;}
.cloud-lock button{background:#F4EEE3;color:#33253A;border:none;border-radius:13px;padding:13px 20px;
  font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.cloud-lock .warn{background:rgba(178,86,68,.25);border:1px solid rgba(240,184,168,.4);border-radius:12px;padding:12px 14px;font-size:12.5px;margin-bottom:16px;}
</style>

const TODAY = new Date().toISOString().slice(0,10);
const CT_CATEGORY_GROUPS = null;

/* ============ UTILIDADES ============ */
function uid(prefix){ return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function fmtMoney(n, currency){
  const sign = n<0 ? '-' : '';
  const abs = Math.abs(round2(n));
  const parts = abs.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const sym = currency==='USD' ? '$' : 'S/';
  return sign+sym+' '+parts.join('.');
}
function fmtEq(n){ return 'S/ '+fmtMoney(n*STATE.settings.fx,'PEN').replace('S/ ',''); }
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d.getDate()+' '+meses[d.getMonth()];
}
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
}
function addMonths(ym, n){
  let [y,m] = ym.split('-').map(Number);
  m += n;
  while(m>12){m-=12;y+=1;}
  while(m<1){m+=12;y-=1;}
  return y+'-'+String(m).padStart(2,'0');
}
function monthDiff(a,b){
  const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number);
  return (by-ay)*12 + (bm-am);
}
function ymOf(iso){ return iso.slice(0,7); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normMerchant(m){ return (m||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[^a-z0-9 áéíóúñ]/g,''); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ ESTADO ============ */
let STATE = null;

function freshState(){
  return {
    savedAt: null,
    txns: JSON.parse(JSON.stringify(SEED.txns)),
    incomes: JSON.parse(JSON.stringify(SEED.incomes)),
    funds: JSON.parse(JSON.stringify(SEED.funds)),
    fundContribs: [],
    debts: JSON.parse(JSON.stringify(SEED.debts)),
    ctAdvances: JSON.parse(JSON.stringify(SEED.ctAdvances)),
    categories: JSON.parse(JSON.stringify(SEED.categories)),
    commitments: JSON.parse(JSON.stringify(SEED.commitments)),
    loans: JSON.parse(JSON.stringify(SEED.loans)),
    merchantMap: JSON.parse(JSON.stringify(SEED.merchantMap)),
    settings: JSON.parse(JSON.stringify(SEED.settings)),
  };
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  if(!raw){ STATE = freshState(); STATE.savedAt = null; runMigrations(); saveState(); return; }
  try{
    STATE = JSON.parse(raw);
  }catch(e){ STATE = freshState(); }
  // asegurar todas las colecciones existan (compatibilidad hacia adelante)
  const base = freshState();
  for(const k of Object.keys(base)){
    if(STATE[k]===undefined) STATE[k] = base[k];
  }
  runMigrations();
  saveState();
}

function saveState(){
  STATE.savedAt = new Date().toISOString();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
  catch(e){ showToast('No se pudo guardar. Descarga una copia desde Ajustes.'); }
  if(window.__onStateSaved) window.__onStateSaved();
}
function getFullState(){ return STATE; }
window.FIREBASE_CONFIG = FIREBASE_CONFIG;
window.CORREO_PERMITIDO = CORREO_PERMITIDO;

/* ============ MIGRACIONES — SIEMPRE corren, sin flags de una sola vez ============ */
function runMigrations(){
  dedupeTxns();
  sincronizarCategorias();
  detectarAnulaciones();
  normalizeCommitmentLinks();
}

function txnFingerprint(t){
  return [t.date, normMerchant(t.merchant), round2(t.amount), t.currency].join('|');
}
function dedupeTxns(){
  const seen = new Map();
  const keep = [];
  for(const t of STATE.txns){
    const fp = txnFingerprint(t);
    if(seen.has(fp)){
      // conservar el que tenga más metadata (linkId, fixed, category no generica)
      const prev = seen.get(fp);
      const score = x => (x.linkId?2:0)+(x.fixed?1:0)+(x.category?1:0)+(x.detalle?1:0);
      if(score(t) > score(prev)){
        const idx = keep.indexOf(prev);
        keep[idx] = t; seen.set(fp, t);
      }
      continue;
    }
    seen.set(fp, t); keep.push(t);
  }
  STATE.txns = keep;
}

function sincronizarCategorias(){
  const catIds = new Set(STATE.categories.map(c=>c.id));
  for(const t of STATE.txns){
    if(t.category && catIds.has(t.category)) continue;
    const key = matchMerchantKey(t.merchant);
    if(key && STATE.merchantMap[key] && catIds.has(STATE.merchantMap[key])){
      t.category = STATE.merchantMap[key];
    } else if(!t.category || !catIds.has(t.category)){
      t.category = 'otros';
    }
  }
}
function matchMerchantKey(merchant){
  const m = normMerchant(merchant);
  let best = null;
  for(const key of Object.keys(STATE.merchantMap)){
    const nk = normMerchant(key); // normaliza también la llave guardada — evita que un '*' rompa la coincidencia
    if(nk && m.includes(nk)){ if(!best || nk.length>best.length) best = key; }
  }
  return best;
}
async function teachMerchant(merchant, categoryId){
  const key = normMerchant(merchant).split(' ').slice(0,3).join(' ');
  if(key) STATE.merchantMap[key] = categoryId;
}

function detectarAnulaciones(){
  // por si algún par nuevo no viene marcado: cargos opuestos mismo monto/moneda en <15 dias
  const byKey = {};
  for(const t of STATE.txns){
    if(t.anulado) continue;
    const k = t.currency+'|'+round2(t.amount);
    (byKey[k]=byKey[k]||[]).push(t);
  }
  for(const k in byKey){
    const list = byKey[k];
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i], b=list[j];
        if(a.anulado||b.anulado) continue;
        if(a.type===b.type) continue;
        const days = Math.abs(new Date(a.date)-new Date(b.date))/86400000;
        if(days<=15){ a.anulado=b.id; b.anulado=a.id; }
      }
    }
  }
}

function normalizeCommitmentLinks(){
  // asegura que cada linkId de txn corresponda a un compromiso, deuda o préstamo existente
  const cmIds = new Set(STATE.commitments.map(c=>c.id));
  const debtIds = new Set(STATE.debts.map(d=>d.id));
  const loanIds = new Set(STATE.loans.map(l=>l.id));
  for(const t of STATE.txns){
    if(t.linkId && !cmIds.has(t.linkId) && !debtIds.has(t.linkId) && !loanIds.has(t.linkId)) t.linkId = null;
  }
}

/* ============ CICLOS Y PERIODOS ============ */
function cycleKeyFor(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const close = STATE.settings.close;
  let y = d.getFullYear(), m = d.getMonth()+1;
  if(d.getDate() > close){ m += 1; if(m>12){m=1;y+=1;} }
  return y+'-'+String(m).padStart(2,'0');
}
function monthKeyFor(dateStr){ return ymOf(dateStr); }
function periodKeyFor(dateStr, mode){ return mode==='ciclo' ? cycleKeyFor(dateStr) : monthKeyFor(dateStr); }

function periodRange(key, mode){
  const [y,m] = key.split('-').map(Number);
  if(mode==='ciclo'){
    const close = STATE.settings.close;
    const endDate = new Date(y, m-1, close);
    const startDate = new Date(y, m-2, close+1);
    return { start: startDate.toISOString().slice(0,10), end: endDate.toISOString().slice(0,10) };
  }
  const start = y+'-'+String(m).padStart(2,'0')+'-01';
  const end = y+'-'+String(m).padStart(2,'0')+'-'+String(daysInMonth(y,m)).padStart(2,'0');
  return { start, end };
}
function periodLabel(key, mode){
  const r = periodRange(key, mode);
  if(mode==='mes'){
    const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const [y,m]=key.split('-').map(Number);
    return meses[m-1][0].toUpperCase()+meses[m-1].slice(1)+' '+y;
  }
  return fmtDateShort(r.start)+' – '+fmtDateShort(r.end);
}
function isCurrentPeriod(key, mode){
  return periodKeyFor(TODAY, mode) === key;
}
function periodDaysElapsed(key, mode){
  const r = periodRange(key, mode);
  const start = new Date(r.start), end = new Date(r.end);
  const now = new Date(TODAY) < end ? new Date(TODAY) : end;
  const total = Math.round((end-start)/86400000)+1;
  const elapsed = Math.max(1, Math.round((now-start)/86400000)+1);
  return { elapsed, total, remaining: Math.max(0,total-elapsed) };
}
function availablePeriodKeys(mode){
  const keys = new Set();
  keys.add(periodKeyFor(TODAY, mode));
  for(const t of STATE.txns) keys.add(periodKeyFor(t.date, mode));
  return Array.from(keys).sort().reverse();
}

/* ============ CLASIFICACIÓN DE MOVIMIENTOS ============ */
// bucket: 'ingreso' | 'fijo' | 'variable' | 'excluido'
// El préstamo del carro es un gasto fijo mensual más (con su propio seguimiento en Tarjeta).
function classify(t){
  if(t.anulado) return 'excluido';
  if(t.type==='pago') return 'excluido'; // pago de tarjeta = traspaso
  if(t.installmentOf) return 'excluido'; // marca de origen de una compra en cuotas, no es gasto del periodo
  if(t.ctMode) return 'excluido'; // gastos CT no cuentan contra el saldo personal
  if(t.type==='ingreso') return 'ingreso';
  if(t.fixed && t.linkId){
    return 'fijo';
  }
  if(t.fixed) return 'fijo';
  return 'variable';
}

// Parte que realmente le corresponde a Mayra si el gasto es compartido (por su compromiso vinculado)
function shareFactor(t){
  if(!t.linkId) return 1;
  const cm = STATE.commitments.find(c=>c.id===t.linkId);
  if(cm && cm.compartido && cm.compartido.miPorcentaje!=null) return cm.compartido.miPorcentaje/100;
  return 1;
}
function shareOwedAmount(t){
  const factor = shareFactor(t);
  if(factor>=1) return 0;
  return round2(t.amount*(1-factor));
}

/* ============ CUOTAS (compromisos con fin por ocurrencias) ============ */
// Determina si un compromiso "cu-*" tiene una cuota vigente en el periodo dado, y cuánto.
function commitmentActiveInPeriod(cm, periodKey, mode){
  if(!cm.active) return false;
  const monthKey = mode==='ciclo' ? periodKey : periodKey; // ambos "YYYY-MM"
  if(cm.skippedMonths && cm.skippedMonths.includes(monthKey)) return false;
  const diff = monthDiff(cm.anchorMonth, monthKey);
  if(diff < 0) return false;
  if(cm.freq==='anual'){
    if(diff % 12 !== 0) return false;
  }
  if(cm.endMode==='ocurrencias'){
    const idx = cm.freq==='anual' ? diff/12 : diff/(cm.intervalMonths||1);
    if(idx >= (cm.occurrences!=null?cm.occurrences:cm.occurrencesTotal)) return false;
  }
  if(cm.endMode==='hasta' && monthKey > cm.endValue) return false;
  if((cm.intervalMonths||1) > 1 && cm.freq!=='anual' && diff % cm.intervalMonths !== 0) return false;
  return true;
}
// ¿Ya existe un movimiento real registrado para este compromiso en este periodo? (evita doble conteo)
function commitmentHasTxnInPeriod(cm, periodKey, mode){
  return STATE.txns.some(t=> t.linkId===cm.id && classify(t)!=='excluido' && periodKeyFor(t.date, mode)===periodKey);
}

/* ============ TOTALES DE UN PERIODO ============ */
function periodData(key, mode){
  const r = periodRange(key, mode);
  const inRange = t => t.date>=r.start && t.date<=r.end;
  const txns = STATE.txns.filter(inRange);

  const lines = []; // {kind, amount, currency, bucket, ...}
  for(const t of txns){
    const bucket = classify(t);
    if(bucket==='excluido') continue;
    const factor = shareFactor(t);
    lines.push({ t, bucket, amount: round2(t.amount*factor), currency: t.currency });
  }

  // cuotas y compromisos programados que no tengan ya un txn real este periodo
  const scheduled = [];
  for(const cm of STATE.commitments){
    if(!commitmentActiveInPeriod(cm, key, mode)) continue;
    if(commitmentHasTxnInPeriod(cm, key, mode)) continue;
    scheduled.push({ cm, bucket: cm.id.startsWith('cu-') ? 'variable' : 'fijo', amount: cm.amount, currency: cm.currency });
  }
  // deuda del carro: si ya llegó su fecha en este periodo y no hay txn registrado, se cuenta programada
  for(const d of STATE.debts){
    if(d.cuotasPagadas >= d.cuotasTotales) continue;
    const hasTxn = STATE.txns.some(t=>t.linkId===d.id && classify(t)!=='excluido' && periodKeyFor(t.date,mode)===key);
    if(hasTxn) continue;
    scheduled.push({ debt:d, bucket:'fijo', amount: d.monthlyPayment, currency:'PEN' });
  }

  function sumBy(bucket, currency){
    let s = 0;
    for(const l of lines) if(l.bucket===bucket && l.currency===currency) s += l.amount;
    for(const s2 of scheduled) if(s2.bucket===bucket && s2.currency===currency) s += s2.amount;
    return round2(s);
  }
  function sumIngreso(currency){
    let s = 0;
    for(const l of lines) if(l.bucket==='ingreso' && l.currency===currency) s += l.amount;
    // ingresos recurrentes (sueldo) — no están en txns, se cuentan una vez por periodo si ya empezó/llegó
    for(const inc of STATE.incomes){
      if(inc.active!==false && inc.recurring && inc.currency===currency && isCurrentOrPastPeriod(key,mode)){
        s += inc.amount;
      }
    }
    return round2(s);
  }

  const fx = STATE.settings.fx;
  const bucketsPEN = { fijo: sumBy('fijo','PEN'), variable: sumBy('variable','PEN') };
  const bucketsUSD = { fijo: sumBy('fijo','USD'), variable: sumBy('variable','USD') };
  const ingresoPEN = sumIngreso('PEN'), ingresoUSD = sumIngreso('USD');

  const gastoEqTotal = round2(bucketsPEN.fijo+bucketsPEN.variable
    + (bucketsUSD.fijo+bucketsUSD.variable)*fx);
  const ingresoEqTotal = round2(ingresoPEN + ingresoUSD*fx);
  const teQueda = round2(ingresoEqTotal - gastoEqTotal);

  return { key, mode, range:r, lines, scheduled, bucketsPEN, bucketsUSD, ingresoPEN, ingresoUSD, gastoEqTotal, ingresoEqTotal, teQueda };
}
function isCurrentOrPastPeriod(key,mode){ return key <= periodKeyFor(TODAY,mode); }

/* ============ COMPARACIÓN CON EL PERIODO ANTERIOR (mismo día) ============ */
function periodDataUpTo(key, mode, dayLimit){
  const r = periodRange(key, mode);
  const start = new Date(r.start);
  const cappedEnd = new Date(start.getTime() + (dayLimit-1)*86400000);
  const realEnd = new Date(r.end);
  const end = cappedEnd < realEnd ? cappedEnd : realEnd;
  const endStr = end.toISOString().slice(0,10);
  const inRange = t => t.date>=r.start && t.date<=endStr;
  let PEN=0, USD=0;
  for(const t of STATE.txns.filter(inRange)){
    const bucket = classify(t);
    if(bucket!=='fijo' && bucket!=='variable') continue;
    const amt = round2(t.amount*shareFactor(t));
    if(t.currency==='PEN') PEN+=amt; else USD+=amt;
  }
  // compromisos/cuotas programados cuyo día de cobro ya cayó dentro de esos días
  for(const cm of STATE.commitments){
    if(!commitmentActiveInPeriod(cm, key, mode)) continue;
    if(commitmentHasTxnInPeriod(cm, key, mode)) continue;
    const dueStr = key+'-'+String(cm.dueDay).padStart(2,'0');
    if(dueStr>r.start && dueStr<=endStr){ if(cm.currency==='PEN') PEN+=cm.amount; else USD+=cm.amount; }
  }
  for(const d of STATE.debts){
    if(d.cuotasPagadas>=d.cuotasTotales) continue;
    const hasTxn = STATE.txns.some(t=>t.linkId===d.id && classify(t)!=='excluido' && periodKeyFor(t.date,mode)===key);
    if(hasTxn) continue;
    const dueStr = key+'-'+String(d.dueDay).padStart(2,'0');
    if(dueStr>=r.start && dueStr<=endStr) PEN += d.monthlyPayment;
  }
  return round2(PEN + USD*STATE.settings.fx);
}
function cycleComparisonHTML(key, mode){
  const prevKey = addMonths(key, -1);
  if(!STATE.txns.some(t=>periodKeyFor(t.date,mode)===prevKey)) return ''; // sin datos del periodo anterior, no comparar
  const days = periodDaysElapsed(key, mode);
  const curEq = periodDataUpTo(key, mode, days.elapsed);
  const prevEq = periodDataUpTo(prevKey, mode, days.elapsed);
  if(prevEq<=0) return '';
  const delta = round2((curEq-prevEq)/prevEq*100);
  const peor = delta>0;
  const color = peor ? 'var(--rust)' : 'var(--sage-deep)';
  const maxBar = Math.max(curEq, prevEq, 1);
  let html = '<div class="card" style="margin-top:10px">';
  html += '<div class="eyebrow">A los mismos '+days.elapsed+' días del ciclo</div>';
  html += '<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px">'+
    '<span style="font-family:\'Fraunces\',serif;font-size:19px">'+fmtMoney(curEq,'PEN')+'</span>'+
    '<span style="font-size:12px;font-weight:700;color:'+color+'">'+(peor?'+':'')+delta+'% vs. ciclo pasado</span></div>';
  html += '<div style="margin-top:10px">';
  html += '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-bottom:2px"><span>Este ciclo</span><span>'+fmtMoney(curEq,'PEN')+'</span></div>';
  html += '<div class="cat-bar-track"><span class="cat-bar-fill" style="width:'+(curEq/maxBar*100)+'%;background:'+color+'"></span></div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin:8px 0 2px"><span>Ciclo pasado</span><span>'+fmtMoney(prevEq,'PEN')+'</span></div>';
  html += '<div class="cat-bar-track"><span class="cat-bar-fill" style="width:'+(prevEq/maxBar*100)+'%;background:var(--ink-soft);opacity:.5"></span></div>';
  html += '</div></div>';
  return html;
}

function categoryTotals(pd){
  const map = {}; // catId -> {PEN, USD}
  for(const l of pd.lines){
    if(l.bucket==='ingreso') continue;
    const cat = l.t.category || 'otros';
    map[cat] = map[cat] || {PEN:0, USD:0};
    map[cat][l.currency] += l.amount;
  }
  for(const s of pd.scheduled){
    const cat = s.cm ? (s.cm.category || 'otros') : 'deuda';
    map[cat] = map[cat] || {PEN:0, USD:0};
    map[cat][s.currency] += s.amount;
  }
  return Object.entries(map).map(([id,v])=>({
    id, cat: STATE.categories.find(c=>c.id===id) || {id,label:id,group:'Otros',color:'#8B8478',bg:'#EAE6DC'},
    PEN: round2(v.PEN), USD: round2(v.USD), eq: round2(v.PEN+v.USD*STATE.settings.fx)
  })).sort((a,b)=>b.eq-a.eq);
}

function catById(id){ return STATE.categories.find(c=>c.id===id) || {id,label:id,color:'#8B8478',bg:'#EAE6DC',group:'Otros'}; }
function toggleGroup(g){ UI.expandedGroups = UI.expandedGroups||{}; UI.expandedGroups[g] = !UI.expandedGroups[g]; render(); }

/* ============ CT — trabajo ============ */
function ctReembolsosPendientes(){
  return STATE.txns.filter(t=>t.ctMode==='reembolso' && t.ctStatus!=='cobrado' && !t.anulado);
}
function ctReembolsosCobrados(){
  return STATE.txns.filter(t=>t.ctMode==='reembolso' && t.ctStatus==='cobrado');
}
function ctAdvanceSummary(adv){
  const gastos = STATE.txns.filter(t=>t.ctMode==='adelanto' && t.advanceId===adv.id && !t.anulado);
  let rendidoPEN=0, rendidoUSD=0;
  for(const g of gastos){ if(g.currency==='PEN') rendidoPEN+=g.amount; else rendidoUSD+=g.amount; }
  rendidoPEN=round2(rendidoPEN); rendidoUSD=round2(rendidoUSD);
  const fx = STATE.settings.fx;
  const advEq = adv.currency==='USD' ? adv.amount : adv.amount/fx; // referencia en USD si aplica
  const rendidoEqSameCurrency = adv.currency==='USD' ? round2(rendidoUSD + rendidoPEN/fx) : round2(rendidoPEN + rendidoUSD*fx);
  const saldo = round2(adv.amount - rendidoEqSameCurrency); // positivo: debe a CT; negativo: CT le debe
  return { gastos, rendidoPEN, rendidoUSD, saldo, moneda: adv.currency };
}

/* ============ Por cobrar (gastos compartidos) ============ */
function porCobrarList(){
  const items = [];
  for(const t of STATE.txns){
    if(t.anulado) continue;
    const owed = shareOwedAmount(t);
    if(owed>0){
      const cm = STATE.commitments.find(c=>c.id===t.linkId);
      items.push({ t, owed, con: cm?.compartido?.con || '—' });
    }
  }
  return items;
}

/* ============ Préstamos a terceros ============ */
// Si yo presté, el pago que recibo es un ingreso. Si a mí me prestaron, el pago que hago es un egreso.
function loanPayments(loan){
  const tipo = loan.dir==='preste' ? 'ingreso' : 'egreso';
  return STATE.txns.filter(t=>t.type===tipo && t.linkId===loan.id && !t.anulado);
}
function loanBalance(loan){
  const pagado = loanPayments(loan).reduce((s,t)=>s+t.amount,0);
  return round2(loan.amount - pagado);
}
function loansNet(){
  let mePrestaronPEN=0, mePrestaronUSD=0, yoPrestePEN=0, yoPresteUSD=0;
  for(const l of STATE.loans){
    const bal = loanBalance(l);
    if(bal<=0) continue;
    if(l.dir==='preste'){ if(l.currency==='PEN') yoPrestePEN+=bal; else yoPresteUSD+=bal; }
    else { if(l.currency==='PEN') mePrestaronPEN+=bal; else mePrestaronUSD+=bal; }
  }
  return { mePrestaronPEN:round2(mePrestaronPEN), mePrestaronUSD:round2(mePrestaronUSD),
            yoPrestePEN:round2(yoPrestePEN), yoPresteUSD:round2(yoPresteUSD) };
}

/* ============ Ahorros ============ */
function fundBalance(fund){
  let total = fund.initial||0;
  for(const c of STATE.fundContribs) if(c.fundId===fund.id) total += c.amount;
  // gastos categoría 'ahorro' asignados a este fondo
  for(const t of STATE.txns) if(t.category==='ahorro' && t.fundId===fund.id && !t.anulado) total += t.amount*(t.currency==='USD'?STATE.settings.fx:1);
  return round2(total);
}
function fundProgress(fund){
  const bal = fundBalance(fund);
  return fund.goal>0 ? Math.min(100, round2(bal/fund.goal*100)) : 0;
}
function monthlySavingsRate(){
  // promedio de aportes de ahorro de los últimos 3 periodos mensuales con datos
  const keys = availablePeriodKeys('mes').slice(0,3);
  if(!keys.length) return 0;
  let total = 0;
  for(const k of keys){
    const pd = periodData(k,'mes');
    for(const l of pd.lines) if(l.t.category==='ahorro') total += l.currency==='USD' ? l.amount*STATE.settings.fx : l.amount;
  }
  return round2(total/keys.length);
}

/* ============ Deuda vehicular ============ */
function debtSummary(debt){
  const cuotaEq = debt.monthlyPayment;
  const restante = debt.cuotasTotales - debt.cuotasPagadas;
  return { ...debt, restante };
}

/* ============ UI / ROUTER ============ */
let UI = {

  stack: [],   // vistas secundarias apiladas sobre el tab actual: {view, params, fromLabel}

  addTab: 'foto',
  editingId: null,
};

function currentPeriodKey(){ return UI.periodKey || periodKeyFor(TODAY, UI.mode); }

function go(tab){
  UI.tab = tab; UI.stack = []; UI.periodKey = null; render(); window.scrollTo(0,0);
}
function push(view, params, label){
  UI.stack.push({ view, params: params||{}, label: label||viewTitle(UI.stack.length?UI.stack[UI.stack.length-1].view:UI.tab) });
  render(); window.scrollTo(0,0);
}
function popStack(){
  UI.stack.pop(); render(); window.scrollTo(0,0);
}
function openSheet(view, params){ UI.sheet = { view, params: params||{} }; render(); }
function closeSheet(){ UI.sheet = null; UI.pending = null; UI.pendingQueue = null; render(); }

function viewTitle(v){
  const t = { resumen:'Resumen', movimientos:'Movimientos', analisis:'Análisis', tarjeta:'Tarjeta', ahorros:'Ahorros',
    ingresos:'Ingresos', fijos:'Gastos fijos', variables:'Variables', prestamos:'Préstamos', ct:'CT — trabajo',
    deudas:'Deudas', categorias:'Categorías', ajustes:'Ajustes', fondoDetalle:'Fondo' };
  return t[v] || v;
}

/* ============ RENDER PRINCIPAL ============ */
function render(){
  const app = document.getElementById('app');
  const topStack = UI.stack.length ? UI.stack[UI.stack.length-1] : null;
  const activeView = topStack ? topStack.view : UI.tab;
  let html = '';
  html += renderHeader();
  html += '<div id="viewhost">';
  if(topStack){
    html += '<div class="view-head"><button class="back-btn" onclick="popStack()">'+svg('back')+' '+esc(topStack.label)+'</button></div>';
  }
  html += renderView(activeView, topStack ? topStack.params : {});
  html += '</div>';
  html += renderNav();
  html += renderFab();
  app.innerHTML = html;
  if(UI.sheet) renderSheetInto();
  else removeSheet();
}
function removeSheet(){ const ex = document.getElementById('sheetHost'); if(ex) ex.remove(); }

function renderHeader(){
  return '<header class="top"><div class="mark">'+svg('leaf')+' Brote</div>'+
    '<div style="display:flex;align-items:center;gap:8px">'+

    '</div></header>';

function renderNav(){
  const tabs = [
    ['resumen','home','Resumen'], ['movimientos','list','Movimientos'], ['analisis','chart','Análisis'],
    ['tarjeta','card','Tarjeta'], ['ahorros','piggy','Ahorros'],
  ];
  let html = '<nav class="tabs"><div class="row">';
  for(const [id,icon,label] of tabs){
    const active = UI.tab===id && UI.stack.length===0 ? 'active' : '';
    html += '<button class="'+active+'" onclick="go(\''+id+'\')">'+svg(icon)+'<span>'+label+'</span></button>';

function renderFab(){
  return '<button class="fab" onclick="openSheet(\'add\')" aria-label="Agregar">'+svg('plus')+'</button>';

  switch(view){

    case 'tarjeta': return viewTarjeta();

/* ============ VISTA: RESUMEN ============ */
function viewResumen(){
  const key = currentPeriodKey();
  const pd = periodData(key, UI.mode);
  const days = periodDaysElapsed(key, UI.mode);
  const porDia = days.remaining>0 ? round2(pd.teQueda/days.remaining) : pd.teQueda;
  const negativo = pd.teQueda < 0;

  let html = renderModeSwitch();

  html += '<div class="hero-card"><div class="label">Te queda — '+esc(periodLabel(key,UI.mode))+'</div>';
  html += '<div class="amount'+(negativo?' neg':'')+'">'+fmtMoney(pd.teQueda,'PEN')+'</div>';
  html += '<div class="sub">Ingresos '+fmtMoney(pd.ingresoEqTotal,'PEN')+' equiv. · Gastos '+fmtMoney(pd.gastoEqTotal,'PEN')+' equiv.</div>';

  const totalGasto = pd.gastoEqTotal || 1;
  const pFijo = (pd.bucketsPEN.fijo+pd.bucketsUSD.fijo*STATE.settings.fx)/totalGasto*100;
  const pVar = (pd.bucketsPEN.variable+pd.bucketsUSD.variable*STATE.settings.fx)/totalGasto*100;
  html += '<div class="bar-track"><span class="bar-seg fijo" style="width:'+pFijo+'%"></span>'+
    '<span class="bar-seg var" style="width:'+pVar+'%"></span></div>';
  html += '<div class="bar-key"><span><i style="background:#8E90C4"></i>Fijos (incluye préstamo del carro)</span><span><i style="background:#E3B872"></i>Variables</span></div>';
  html += '<div class="hero-mini"><div class="m">Por día que queda<b>'+fmtMoney(porDia,'PEN')+'</b></div>'+
    '<div class="m">Días restantes<b>'+days.remaining+'</b></div></div>';
  html += '</div>';

  html += cycleComparisonHTML(key, UI.mode);

  // Desglose soles / dólares por separado — nunca solo el equivalente
  html += '<div class="card" style="margin-top:10px">';
  html += rowMoneda('Ingresos', pd.ingresoPEN, pd.ingresoUSD, true);
  html += rowMoneda('Gastos fijos (incl. préstamo del carro)', pd.bucketsPEN.fijo, pd.bucketsUSD.fijo);
  html += rowMoneda('Gastos variables', pd.bucketsPEN.variable, pd.bucketsUSD.variable);
  html += '</div>';

  // alertas
  const alerts = buildAlerts(key);
  for(const a of alerts) html += a;

  html += '<h2 class="section-title">Accesos</h2>';
  html += '<div class="hub">';
  html += hubTile('ingresos','case','Ingresos', fmtMoney(pd.ingresoPEN,'PEN')+(pd.ingresoUSD?' + '+fmtMoney(pd.ingresoUSD,'USD'):''));
  html += hubTile('fijos','card','Gastos fijos', fmtMoney(pd.bucketsPEN.fijo,'PEN')+(pd.bucketsUSD.fijo?' + '+fmtMoney(pd.bucketsUSD.fijo,'USD'):''));
  html += hubTile('variables','list','Variables', fmtMoney(pd.bucketsPEN.variable,'PEN')+(pd.bucketsUSD.variable?' + '+fmtMoney(pd.bucketsUSD.variable,'USD'):''));
  html += hubTile('prestamos','users','Préstamos', prestamosResumenTxt());
  html += hubTile('ct','case','CT — trabajo', ctResumenTxt());
  html += hubTile('deudas','gift','Por cobrar', porCobrarTxt());
  html += '</div>';
  return html;
}

function hubTile(view, icon, label, value){
  return '<button class="hub-tile" onclick="push(\''+view+'\')"><div class="th">'+svg(icon)+esc(label)+'</div>'+
    '<div class="tv">'+esc(value)+'</div></button>';

function prestamosResumenTxt(){
  const n = loansNet();
  const parts = [];
  if(n.mePrestaronPEN||n.mePrestaronUSD) parts.push('Debo '+(n.mePrestaronPEN?fmtMoney(n.mePrestaronPEN,'PEN'):fmtMoney(n.mePrestaronUSD,'USD')));
  if(n.yoPrestePEN||n.yoPresteUSD) parts.push('Me deben '+(n.yoPrestePEN?fmtMoney(n.yoPrestePEN,'PEN'):fmtMoney(n.yoPresteUSD,'USD')));
  return parts.length ? parts.join(' · ') : 'Sin pendientes';
}
function ctResumenTxt(){
  const pend = ctReembolsosPendientes();
  if(!pend.length) return 'Sin reembolsos pendientes';
  const pen = pend.filter(t=>t.currency==='PEN').reduce((s,t)=>s+t.amount,0);
  return 'Por cobrar '+fmtMoney(pen,'PEN');
}
function porCobrarTxt(){
  const items = porCobrarList();
  if(!items.length) return 'Nada pendiente';
  const total = items.reduce((s,i)=>s+i.owed,0);
  return fmtMoney(total,'PEN')+' de '+items[0].con;
}
function buildAlerts(key){
  const html = [];
  const pd = periodData(key, UI.mode);
  if(pd.teQueda < 0){
    html.push('<div class="alert-card warn">'+svg('warn')+'<div>Este '+(UI.mode==='ciclo'?'ciclo':'mes')+' vas en déficit de '+fmtMoney(Math.abs(pd.teQueda),'PEN')+'. Revisa Variables para ver dónde recortar.</div></div>');
  }
  // compromisos manuales próximos a vencer (7 dias) sin pagar
  const soon = STATE.commitments.filter(cm=>{
    if(cm.autopay || !cm.active) return false;
    if(!commitmentActiveInPeriod(cm, key, UI.mode)) return false;
    if(commitmentHasTxnInPeriod(cm, key, UI.mode)) return false;
    const due = new Date(key+'-'+String(cm.dueDay).padStart(2,'0'));
    const diffDays = Math.round((due-new Date(TODAY))/86400000);
    return diffDays>=0 && diffDays<=7;
  });
  for(const cm of soon){
    html.push('<div class="alert-card info">'+svg('info')+'<div><b>'+esc(cm.name)+'</b> vence el '+cm.dueDay+' — '+fmtMoney(cm.amount,cm.currency)+'</div></div>');
  }
  // topes de categoría pasados
  const cats = categoryTotals(pd);
  for(const c of cats){
    if(c.cat.limit && c.eq >= c.cat.limit){
      html.push('<div class="alert-card warn">'+svg('warn')+'<div><b>'+esc(c.cat.label)+'</b> pasó su tope de S/ '+c.cat.limit+' (llevas '+fmtMoney(c.eq,'PEN')+').</div></div>');
    }
  }
  return html;
}

function movListHTML(pd){
  const q = normMerchant(UI.searchQuery||'');
  let items = pd.lines.slice().sort((a,b)=> b.t.date.localeCompare(a.t.date) || (b.t.id||'').localeCompare(a.t.id||''));
  if(q){
    items = items.filter(l=>{
      const cat = catById(l.t.category);
      const hay = normMerchant((l.t.alias||'')+' '+(l.t.merchant||'')+' '+(l.t.detalle||'')+' '+(cat.label||''));
      return hay.includes(q);
    });
  }
  if(!items.length){
    return '<div class="empty">'+svg('list')+'<div>'+(q?'Nada coincide con “'+esc(UI.searchQuery)+'”.':'No hay movimientos en este periodo.')+'</div></div>';
  }
  let html = '';
  let lastDay = null;
  for(const l of items){
    const t = l.t;
    if(!q && t.date !== lastDay){
      html += '<div class="day-hdr">'+fmtDateLong(t.date)+'</div>';
      lastDay = t.date;
    } else if(q && t.date !== lastDay){
      html += '<div class="day-hdr">'+fmtDateShort(t.date)+'</div>';
      lastDay = t.date;
    }
    html += txnRowHTML(t, l);
  }
  return html;
}

function txnRowHTML(t, l){

function dualAmtHTML(pen, usd){

  if(pen && usd){
    const eq = round2(pen+usd*STATE.settings.fx);
    html += '<span style="display:block;font-size:9.5px;color:var(--ink-soft);font-weight:400;text-align:right">≈ '+fmtMoney(eq,'PEN')+'</span>';
  }
  return html;

function viewAnalisis(){
  const key = currentPeriodKey();
  const pd = periodData(key, UI.mode);
  const cats = categoryTotals(pd);
  let html = renderModeSwitch();

  html += '<div class="card"><div class="eyebrow">Por moneda</div>';
  html += rowMoneda('Total del periodo', pd.bucketsPEN.fijo+pd.bucketsPEN.variable,
    pd.bucketsUSD.fijo+pd.bucketsUSD.variable);
  html += '</div>';

  html += '<h2 class="section-title">Por categoría</h2>';
  if(!cats.length){ html += '<div class="card"><div class="empty">Sin gastos este periodo.</div></div>'; }
  const byGroup = {};
  for(const c of cats){ (byGroup[c.cat.group]=byGroup[c.cat.group]||[]).push(c); }
  const groupTotals = Object.entries(byGroup).map(([g,list])=>({
    group:g, list, eq: list.reduce((s,c)=>s+c.eq,0),
    PEN: round2(list.reduce((s,c)=>s+c.PEN,0)), USD: round2(list.reduce((s,c)=>s+c.USD,0))
  })).sort((a,b)=>b.eq-a.eq);
  const maxGroupEq = Math.max(...groupTotals.map(g=>g.eq), 1);
  UI.expandedGroups = UI.expandedGroups || {};
  for(const g of groupTotals){
    const isOpen = !!UI.expandedGroups[g.group];
    html += '<div class="card" style="margin-top:8px">';
    html += '<div style="cursor:pointer" onclick="toggleGroup(\''+esc(g.group).replace(/'/g,"\\'")+'\')">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span style="font-weight:700;font-size:13.5px">'+esc(g.group)+'</span>'+
      '<span style="display:flex;align-items:center;gap:6px">'+
      '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:12.5px;text-align:right">'+dualAmtHTML(g.PEN,g.USD)+'</span>'+
      '<svg style="width:14px;height:14px;flex-shrink:0;transform:rotate('+(isOpen?'180':'0')+'deg);transition:transform .15s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO.chevdown+'</svg></span></div>';
    html += '<div class="cat-bar-track" style="margin-top:8px"><span class="cat-bar-fill" style="width:'+(g.eq/maxGroupEq*100)+'%;background:'+g.list[0].cat.color+'"></span></div>';
    html += '</div>';
    if(isOpen){
      html += '<div style="margin-top:4px;border-top:1px solid var(--line)">';
      const maxSub = Math.max(...g.list.map(c=>c.eq),1);
      for(const c of g.list.sort((a,b)=>b.eq-a.eq)){
        html += '<div class="cat-row"><span class="cat-swatch" style="background:'+c.cat.color+'"></span>';
        html += '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:12px">'+
          '<span>'+esc(c.cat.label)+'</span><span style="font-family:\'IBM Plex Mono\',monospace">'+
          dualAmtHTML(c.PEN,c.USD)+'</span></div>';
        html += '<div class="cat-bar-track" style="height:5px"><span class="cat-bar-fill" style="width:'+(c.eq/maxSub*100)+'%;background:'+c.cat.color+'"></span></div>';
        if(c.cat.limit){
          const pct = round2(c.eq/c.cat.limit*100);
          const color = pct>=100 ? 'var(--rust)' : pct>=80 ? 'var(--ochre)' : 'var(--sage-deep)';
          html += '<div style="display:flex;justify-content:space-between;font-size:10px;color:'+color+';font-weight:700;margin-top:2px">'+
            '<span>Tope S/ '+c.cat.limit+'</span><span>'+pct+'%'+(pct>=100?' — pasado':'')+'</span></div>';
        }
        html += '</div></div>';
      }
      html += '<button class="btn ghost sm" style="margin-top:8px" onclick="event.stopPropagation();toggleGroup(\''+esc(g.group).replace(/'/g,"\\'")+'\')">'+svg('x')+' Cerrar</button>';
      html += '</div>';
    }
    html += '</div>';
  }

  // top subcategorías (todas mezcladas, sin importar el grupo)
  const topSubs = cats.slice(0,5);
  if(topSubs.length){
    html += '<h2 class="section-title">Top subcategorías</h2><div class="card">';
    const maxTop = Math.max(...topSubs.map(c=>c.eq),1);
    for(const c of topSubs){
      html += '<div class="cat-row"><span class="cat-swatch" style="background:'+c.cat.color+'"></span>';
      html += '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-size:12.5px">'+
        '<span>'+esc(c.cat.label)+' <span style="color:var(--ink-soft);font-weight:400">· '+esc(c.cat.group)+'</span></span>'+
        '<span style="font-family:\'IBM Plex Mono\',monospace">'+dualAmtHTML(c.PEN,c.USD)+'</span></div>';
      html += '<div class="cat-bar-track"><span class="cat-bar-fill" style="width:'+(c.eq/maxTop*100)+'%;background:'+c.cat.color+'"></span></div></div></div>';
    }
    html += '</div>';
  }

  // top comercios
  const merchMap = {};
  for(const l of pd.lines){
    if(l.bucket==='ingreso') continue;
    const key2 = l.t.merchant+'|'+l.currency;
    merchMap[key2] = merchMap[key2] || {name:l.t.merchant, currency:l.currency, total:0, n:0};
    merchMap[key2].total += l.amount; merchMap[key2].n++;
  }
  const top = Object.values(merchMap).sort((a,b)=>b.total-a.total).slice(0,5);
  if(top.length){
    html += '<h2 class="section-title">Top comercios</h2><div class="card">';
    for(const m of top){
      html += '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px">'+
        '<span>'+esc(m.name)+' <span style="color:var(--ink-soft)">×'+m.n+'</span></span>'+
        '<span style="font-family:\'IBM Plex Mono\',monospace">'+fmtMoney(m.total,m.currency)+'</span></div>';
    }
    html += '</div>';
  }
  return html;
}

/* ============ VISTA: TARJETA ============ */
function viewTarjeta(){
  const key = currentPeriodKey();
  let html = renderModeSwitch();

  const fijosCm = STATE.commitments.filter(c=>!c.id.startsWith('cu-'));
  const cuotasCm = STATE.commitments.filter(c=>c.id.startsWith('cu-'));

  html += '<h2 class="section-title">Compromisos fijos<span class="eyebrow">'+fijosCm.length+'</span></h2><div class="card">';
  for(const cm of fijosCm.sort((a,b)=>a.dueDay-b.dueDay)){
    html += commitmentRowHTML(cm, key);
  }
  html += '</div>';
  html += '<button class="btn ghost" style="margin-top:10px" onclick="openSheet(\'editarCompromiso\')">+ Nuevo compromiso fijo</button>';

  html += '<h2 class="section-title">Préstamo vehicular</h2>';
  for(const d of STATE.debts){
    const s = debtSummary(d);
    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div><div style="font-weight:700;font-size:13.5px">'+esc(d.name)+'</div>'+
      '<div class="txn-meta">Cuota '+fmtMoney(d.monthlyPayment,'PEN')+' · día '+d.dueDay+'</div></div>'+
      '<span class="chip prest">'+s.restante+' de '+d.cuotasTotales+'</span></div>';
    html += '<div class="progress-mini"><i style="width:'+(d.cuotasPagadas/d.cuotasTotales*100)+'%;background:var(--ochre)"></i></div>';
    const endYm = addMonths(ymOf(TODAY), s.restante-1);
    html += '<div class="txn-meta" style="margin-top:8px">Capital pendiente '+fmtMoney(d.capitalPendiente,'PEN')+' · termina ~'+endYm+' · total del crédito '+fmtMoney(d.total,'PEN')+'</div></div>';
  }

  html += '<h2 class="section-title">Compras en cuotas<span class="eyebrow">'+cuotasCm.length+'</span></h2><div class="card">';
  if(!cuotasCm.length) html += '<div class="empty">Sin compras en cuotas.</div>';
  for(const cm of cuotasCm.sort((a,b)=>a.dueDay-b.dueDay)){
    const restante = cm.occurrences!=null ? cm.occurrences : cm.occurrencesTotal;
    const endMonth = addMonths(cm.anchorMonth, cm.occurrencesTotal-1);
    const endDate = endMonth+'-'+String(cm.dueDay).padStart(2,'0');
    const total = round2(cm.amount*cm.occurrencesTotal);
    html += '<div class="txn-row" style="cursor:default"><div class="txn-dot" style="background:#EFE3CC;color:#7A5A1F">%</div>';
    html += '<div class="txn-info"><div class="txn-name">'+esc(cm.name)+'</div>';
    html += '<div class="txn-meta">'+esc(cm.descriptor||'')+' · '+restante+' de '+cm.occurrencesTotal+' restantes</div>';
    html += '<div class="txn-meta">Termina '+fmtDateShort(endDate)+' '+endMonth.slice(0,4)+' · total '+fmtMoney(total,cm.currency)+'</div></div>';
    html += '<div class="txn-amt">'+fmtMoney(cm.amount,cm.currency);
    if(cm.currency==='USD') html += '<span class="eq">≈ '+fmtEq(cm.amount)+'</span>';
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}
function commitmentRowHTML(cm, periodKey){
  const active = commitmentActiveInPeriod(cm, periodKey, UI.mode);
  const paid = commitmentHasTxnInPeriod(cm, periodKey, UI.mode);
  let statusChip = '';
  if(!cm.active) statusChip = '<span class="chip var">Pausado</span>';
  else if(active) statusChip = paid ? '<span class="chip fijo">Pagado</span>' : (cm.autopay?'<span class="chip var">Programado</span>':'<span class="chip prest">Manual</span>');
  const duracionTxt = cm.endMode==='hasta' ? ('hasta '+cm.endValue) : cm.endMode==='ocurrencias' ? ((cm.occurrences!=null?cm.occurrences:cm.occurrencesTotal)+' de '+cm.occurrencesTotal) : 'indefinido';
  let html = '<div class="txn-row" onclick="openSheet(\'editarCompromiso\',{id:\''+cm.id+'\'})"><div class="txn-dot" style="background:'+catById(cm.category).bg+';color:'+catById(cm.category).color+'">'+(cm.name[0])+'</div>';
  html += '<div class="txn-info"><div class="txn-name">'+esc(cm.name)+'</div>';
  html += '<div class="txn-meta">día '+cm.dueDay+' · '+(cm.freq==='anual'?'anual':'mensual')+' · '+duracionTxt+(cm.compartido?' · compartido '+cm.compartido.miPorcentaje+'%':'')+'</div></div>';
  html += '<div style="text-align:right">'+statusChip+'<div class="txn-amt" style="margin-top:3px">'+fmtMoney(cm.amount,cm.currency)+'</div></div></div>';
  return html;
}

/* ============ VISTA: AHORROS ============ */
function viewAhorros(){
  const total = STATE.funds.reduce((s,f)=>s+fundBalance(f),0);
  const goal = STATE.funds.reduce((s,f)=>s+f.goal,0);
  const rate = monthlySavingsRate();
  let html = '';

  html += '<div class="amount">'+fmtMoney(total,'PEN')+'</div>';
  html += '<div class="sub">Meta conjunta '+fmtMoney(goal,'PEN')+' · ritmo '+fmtMoney(rate,'PEN')+'/mes</div></div>';

  html += '<h2 class="section-title">Fondos</h2>';
  for(const f of STATE.funds){
    const bal = fundBalance(f); const pct = fundProgress(f);
    const monthsLeft = rate>0 ? Math.max(0,Math.ceil((f.goal-bal)/rate)) : null;
    html += '<div class="card" onclick="push(\'fondoDetalle\',{id:\''+f.id+'\'})" style="cursor:pointer">';

    html += '<div class="txn-meta" style="margin-top:7px">'+fmtMoney(bal,'PEN')+' de '+fmtMoney(f.goal,'PEN')+
      (monthsLeft!=null && bal<f.goal ? ' · ~'+monthsLeft+' meses al ritmo actual' : '')+'</div></div>';
  }
  html += '<div class="grid2" style="margin-top:12px">';
  html += '<button class="btn ghost" onclick="openSheet(\'aportar\')">Aportar a un fondo</button>';

function updateSetting(key, val){

function exportarDatos(){
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'brote-datos-'+TODAY+'.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('Descargando copia…');
}
function importarArchivo(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{ try{ mergeImport(JSON.parse(e.target.result)); }catch(err){ showToast('Archivo inválido'); } };
  reader.readAsText(file);
}
function mergeImport(data, mode, silent){
  mode = mode || 'combinar';
  if(mode==='reemplazar'){
    STATE = data;
  } else {
    const existingIds = new Set(STATE.txns.map(t=>t.id));
    for(const t of (data.txns||[])) if(!existingIds.has(t.id)) STATE.txns.push(t);
    for(const key of ['funds','ctAdvances','commitments','loans','categories','incomes','debts','fundContribs']){
      const ids = new Set((STATE[key]||[]).map(x=>x.id));
      for(const x of (data[key]||[])) if(!ids.has(x.id)) STATE[key].push(x);
    }
    Object.assign(STATE.merchantMap, data.merchantMap||{});
  }
  runMigrations(); // SIEMPRE tras importar — nunca datos sucios
  saveState();
  if(!silent){ showToast('Datos importados'); render(); }
}

function guardarACuotas(id){
  const t = STATE.txns.find(x=>x.id===id); if(!t) return;
  const n = parseInt(document.getElementById('cuN').value,10);
  const monto = parseFloat(document.getElementById('cuMonto').value);

  if(!n || !monto || !/^\d{4}-\d{2}$/.test(desde)){ showToast('Revisa los datos'); return; }

    id: cmId, name: t.alias||t.merchant, descriptor: 'Capital pendiente '+fmtMoney(t.amount,t.currency),
    amount: round2(monto), currency: t.currency, dueDay: new Date(t.date+'T00:00:00').getDate(),
    category: t.category, freq: 'mensual', intervalMonths: 1, anchorMonth: desde,
    endMode: 'ocurrencias', occurrences: n, occurrencesTotal: n, active: true, fromTxn: t.id
  });

/* ---- Selector de dos niveles: categoría (grupo) → subcategoría ---- */
function categoryGroups(){ return Array.from(new Set(STATE.categories.map(c=>c.group))); }
function subcatsOf(group){ return STATE.categories.filter(c=>c.group===group); }
function catPickerHTML(prefix, selectedId){
  const sel = selectedId ? catById(selectedId) : null;
  const selGroup = sel ? sel.group : categoryGroups()[0];
  let html = '<div class="grid2">';
  html += '<label class="field"><span class="lt">Categoría</span><select id="'+prefix+'Group" onchange="catPickerGroupChanged(\''+prefix+'\')">';
  for(const g of categoryGroups()) html += '<option value="'+esc(g)+'" '+(g===selGroup?'selected':'')+'>'+esc(g)+'</option>';
  html += '<option value="__nuevoGrupo__">+ Crear grupo nuevo…</option></select></label>';
  html += '<label class="field"><span class="lt">Subcategoría</span><select id="'+prefix+'Sub" onchange="catPickerSubChanged(\''+prefix+'\')">'+
    catSubOptionsHTML(selGroup, selectedId)+'</select></label>';
  html += '</div>';
  return html;
}
function catSubOptionsHTML(group, selectedId){
  let html = '';
  for(const c of subcatsOf(group)) html += '<option value="'+c.id+'" '+(c.id===selectedId?'selected':'')+'>'+esc(c.label)+'</option>';
  html += '<option value="__nuevaSub__">+ Crear subcategoría nueva…</option>';
  return html;
}
function catPickerGroupChanged(prefix){
  const groupSel = document.getElementById(prefix+'Group');
  if(groupSel.value==='__nuevoGrupo__'){
    const g = prompt('Nombre del grupo nuevo:');
    if(!g){ groupSel.value = categoryGroups()[0]; return; }
    const opt = document.createElement('option'); opt.value=g; opt.textContent=g; opt.selected=true;
    groupSel.insertBefore(opt, groupSel.lastElementChild);
    const subSel = document.getElementById(prefix+'Sub');
    subSel.innerHTML = '<option value="__nuevaSub__">+ Crear subcategoría nueva…</option>';
    catPickerSubChanged(prefix, g);
    return;
  }
  const subSel = document.getElementById(prefix+'Sub');
  subSel.innerHTML = catSubOptionsHTML(groupSel.value, null);
}
function catPickerSubChanged(prefix, forceGroup){
  const subSel = document.getElementById(prefix+'Sub');
  if(subSel.value==='__nuevaSub__'){
    const label = prompt('Nombre de la subcategoría nueva:');
    const group = forceGroup || document.getElementById(prefix+'Group').value;
    if(!label){ subSel.value = subSel.options.length>1 ? subSel.options[0].value : ''; return; }
    const id = uid('cat');
    STATE.categories.push({ id, label, group, color:'#8B8478', bg:'#EAE6DC' });
    saveState();
    const opt = document.createElement('option'); opt.value=id; opt.textContent=label; opt.selected=true;
    subSel.insertBefore(opt, subSel.lastElementChild);
  }
}
function catPickerValue(prefix){
  const sub = document.getElementById(prefix+'Sub').value;
  return sub==='__nuevaSub__' ? 'otros' : sub;
}

/* ============ PARSER DE TEXTO (heurístico, sin necesitar internet) ============ */
const MESES_IDX = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12,
  ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};
function parseTextoLibre(raw){
  const txt = raw.trim();
  const low = txt.toLowerCase();
  let currency = /\busd\b|\$\s*[\d,]/i.test(txt) && !/s\/\.?\s*[\d,]/i.test(txt) ? 'USD' : 'PEN';
  if(/\$\s*-?[\d,]+\.?\d*/.test(txt) && !/s\/\.?\s*-?[\d,]+/i.test(txt)) currency = 'USD';
  let amountMatch = txt.match(/(?:s\/\.?|\$)\s*-?([\d,]+\.?\d*)/i);
  if(!amountMatch) amountMatch = txt.match(/(-?\d+[.,]?\d*)\s*(soles|dólares|dolares|usd)/i);
  const amount = amountMatch ? parseFloat(amountMatch[1].replace(/,/g,'')) : null;

  let date = TODAY;
  const dm = txt.match(/(\d{1,2})\s*(?:de\s*)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre|ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)/i);
  if(dm){
    const day = parseInt(dm[1],10); const mo = MESES_IDX[dm[2].toLowerCase()];
    const y = new Date(TODAY).getFullYear();
    date = y+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  } else if(/ayer/i.test(low)){
    const d = new Date(TODAY+'T00:00:00'); d.setDate(d.getDate()-1); date = d.toISOString().slice(0,10);
  }

  let merchant = null;
  const bankLine = txt.match(/^([A-Za-zÀ-ÿ0-9*.\s]+?)\s+(?:s\/\.?|\$)\s*-?[\d,]+/i);
  if(bankLine) merchant = bankLine[1].trim();
  if(!merchant){
    const en = low.match(/(?:en|a|con)\s+([a-záéíóúñ0-9\s]+?)(?:,|\.|$| ayer| hoy)/i);
    if(en) merchant = en[1].trim();
  }
  if(!merchant) merchant = txt.slice(0,30);
  merchant = merchant.replace(/\s+/g,' ').trim();
  merchant = merchant.charAt(0).toUpperCase()+merchant.slice(1);

  const opMatch = txt.match(/(?:operaci[oó]n|op\.?)\s*#?\s*(\d{4,})/i);
  const opNumber = opMatch ? opMatch[1] : null;

  const isIngreso = /me prest|me deposit|me pag|ingres/i.test(low) && !/le prest/i.test(low);

  return { date, merchant, amount, currency, opNumber, type: isIngreso?'ingreso':'egreso', raw: txt };
}
function procesarTexto(){
  const raw = document.getElementById('textoInput').value;
  if(!raw.trim()){ showToast('Escribe o pega algo primero'); return; }
  const parsed = parseTextoLibre(raw);
  if(!parsed.amount){ showToast('No pude leer el monto — intenta manual'); return; }
  UI.pending = parsed; render();
}

/* ============ FOTO Y VOZ — vía API de Anthropic (necesitan internet) ============ */
function getApiKey(){ try{ return localStorage.getItem('brote-api-key') || ''; }catch(e){ return ''; } }
async function callClaudeExtract(contentBlocks){
  const year = new Date(TODAY).getFullYear();
  const instrucciones = [
    'Vas a recibir una imagen financiera. Puede ser de varios tipos y a veces varias juntas en una sola foto:',
    '(a) una LISTA de movimientos de una app de banco o tarjeta (una fila = un movimiento distinto — sepáralos todos, no te saltes ninguno, aunque haya muchos; ignora resúmenes como "Próx. pago" o "Crédito utilizado", esos no son movimientos);',
    '(b) un comprobante de Yape/Plin/transferencia (un solo movimiento);',
    '(c) una boleta o factura con varios productos (es UN SOLO movimiento — usa el monto TOTAL final, nunca sumes ni listes cada producto por separado);',
    '(d) un estado de cuenta impreso con muchas filas (puede haber decenas de movimientos — sepáralos todos).',
    'De cada movimiento extrae: fecha (YYYY-MM-DD; si dice "Hoy" usa '+TODAY+', si solo dice día y mes usa el año '+year+'), monto (número positivo), moneda, comercio (el nombre del negocio o persona, nunca el banco que envía la notificación), y número de operación si aparece.',
    'Esta app solo maneja soles (S/, PEN) y dólares ($, USD). Si un movimiento está en cualquier otra moneda (pesos chilenos, euros, etc.), NO LO INCLUYAS en la respuesta.',
    'Responde SOLO con un arreglo JSON, uno por movimiento encontrado: [{"date":"YYYY-MM-DD","amount":0,"currency":"PEN","merchant":"","opNumber":null}]. Nada de texto antes o después, ni aunque solo encuentres uno o ninguno (arreglo vacío [] si no hay nada válido).'
  ].join(' ');
  const body = {
    model: 'claude-sonnet-4-6', max_tokens: 4000,
    messages: [{ role:'user', content: [
      ...contentBlocks,
      { type:'text', text: instrucciones }
    ]}]
  };
  const headers = {'Content-Type':'application/json'};
  const key = getApiKey();
  if(key){ headers['x-api-key'] = key; headers['anthropic-version'] = '2023-06-01'; headers['anthropic-dangerous-direct-browser-access'] = 'true'; }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers, body: JSON.stringify(body)
  });
  if(!res.ok){
    if(res.status===401 || res.status===403) throw new Error('sin-clave');
    throw new Error('error-'+res.status);
  }
  const data = await res.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('sin respuesta');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  const result = JSON.parse(clean);
  return Array.isArray(result) ? result : [result]; // compatibilidad si el modelo devuelve un solo objeto
}
function procesarFoto(input){
  const file = input.files[0]; if(!file) return;
  const status = document.getElementById('fotoStatus');
  status.innerHTML = '<span class="spin" style="border-color:rgba(42,34,51,.3);border-top-color:var(--mauve)"></span> Leyendo la imagen…';
  const reader = new FileReader();
  reader.onload = async e=>{
    const base64 = e.target.result.split(',')[1];
    const mediaType = file.type || 'image/jpeg';
    try{
      const items = await callClaudeExtract([{ type:'image', source:{ type:'base64', media_type: mediaType, data: base64 } }]);
      if(!items.length){
        status.textContent = 'No encontré movimientos en soles o dólares en esta imagen.';
        return;
      }
      UI.pendingQueue = items.map(parsed => ({ date: parsed.date||TODAY, merchant: parsed.merchant||'', amount: parsed.amount||null,
        currency: parsed.currency==='USD'?'USD':'PEN', opNumber: parsed.opNumber||null, type:'egreso' }));
      UI.pending = UI.pendingQueue.shift();
      render();
    }catch(err){
      if(err.message==='sin-clave') status.innerHTML = 'Fuera de Claude, esto necesita tu clave de API. Agrégala en <b>Ajustes → Foto y voz</b>.';
      else status.textContent = 'No pude leer la foto (revisa tu conexión). Prueba con Texto o Manual.';
    }
  };
  reader.readAsDataURL(file);
}

/* ===================== EXPORTAR A EXCEL =====================
   Genera un .xlsx real sin librerías externas (funciona sin internet):
   un .xlsx es un ZIP con XMLs adentro, aquí construido "almacenado" (sin comprimir). */
const CRC_TABLA = (()=>{
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i;
    for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1;
    t[i]=c>>>0; }
  return t;
})();
function crc32(bytes){
  let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLA[(c^bytes[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
const utf8 = str => new TextEncoder().encode(str);
function zipCrear(archivos){
  const partes=[], central=[];
  let offset=0;
  const u16=n=>[n&0xFF,(n>>8)&0xFF];
  const u32=n=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
  archivos.forEach(f=>{
    const nombre=utf8(f.nombre), datos=utf8(f.contenido), crc=crc32(datos);
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(datos.length),...u32(datos.length),
      ...u16(nombre.length),...u16(0)];
    partes.push(new Uint8Array(local), nombre, datos);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(datos.length),...u32(datos.length),
      ...u16(nombre.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);
    central.push(nombre);
    offset += local.length + nombre.length + datos.length;
  });
  const centralBytes=[];
  central.forEach(c=>{ centralBytes.push(...c); });
  const cd=new Uint8Array(centralBytes);
  const fin=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(archivos.length),...u16(archivos.length),...u32(cd.length),...u32(offset),...u16(0)]);
  const total=partes.reduce((s,p)=>s+p.length,0)+cd.length+fin.length;
  const out=new Uint8Array(total);
  let pos=0;
  partes.forEach(p=>{ out.set(p,pos); pos+=p.length; });
  out.set(cd,pos); pos+=cd.length;
  out.set(fin,pos);
  return out;
}
const xmlEsc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const colLetra = n => { let s=''; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26);} return s; };
function hojaXML(filas){
  const rows = filas.map((fila,i)=>{
    const celdas = fila.map((v,j)=>{
      const ref = colLetra(j)+(i+1);
      if(typeof v==='number' && isFinite(v)) return '<c r="'+ref+'"'+(i===0?' s="1"':'')+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"'+(i===0?' s="1"':'')+'><is><t>'+xmlEsc(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(i+1)+'">'+celdas+'</row>';
  }).join('');
  const anchos = (filas[0]||[]).map((_,j)=>'<col min="'+(j+1)+'" max="'+(j+1)+'" width="18" customWidth="1"/>').join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>'+anchos+'</cols><sheetData>'+rows+'</sheetData></worksheet>';
}
function construirXLSX(hojas){
  const archivos=[
    { nombre:'[Content_Types].xml', contenido:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+hojas.map((h,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>' },
    { nombre:'_rels/.rels', contenido:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { nombre:'xl/workbook.xml', contenido:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+hojas.map((h,i)=>'<sheet name="'+xmlEsc(h.nombre)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>' },
    { nombre:'xl/_rels/workbook.xml.rels', contenido:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+hojas.map((h,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(hojas.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { nombre:'xl/styles.xml', contenido:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF2A2233"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFECE3D3"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>' },
  ];
  hojas.forEach((h,i)=> archivos.push({ nombre:'xl/worksheets/sheet'+(i+1)+'.xml', contenido: hojaXML(h.filas) }));
  return zipCrear(archivos);
}
