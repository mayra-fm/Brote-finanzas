    const s = ctAdvanceSummary(a);
    ctAdel.push([ a.note, a.date, +round2(a.amount), a.currency, +round2(Math.abs(s.saldo)), s.saldo>=0?'Le debe a CT':'CT le debe' ]);
  });
  const ctReemb = [['Fecha','Comercio','Categoría','Monto','Moneda','Estado']];
  STATE.txns.filter(t=>t.ctMode==='reembolso').sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    ctReemb.push([ t.date, t.merchant, catById(t.category).label, +round2(t.amount), t.currency, t.ctStatus==='cobrado'?'Cobrado':'Pendiente' ]);
  });

  const ahorros = [['Fondo','Meta','Saldo actual','Avance %']];
  STATE.funds.forEach(f=> ahorros.push([ f.name, +round2(f.goal), +round2(fundBalance(f)), +fundProgress(f) ]));

  const prestamos = [['Sentido','Persona','Concepto','Monto','Moneda','Fecha','Saldo']];
  STATE.loans.forEach(l=> prestamos.push([ l.dir==='preste'?'Yo presté':'Me prestaron', l.persona, l.concepto||'', +round2(l.amount), l.currency, l.date, +round2(loanBalance(l)) ]));

  const porCategoria = [['Categoría','Grupo','En soles','En dólares','Total en soles (mes actual)']];
  categoryTotals(periodData(meses,'mes')).forEach(c=> porCategoria.push([ c.cat.label, c.cat.group, +c.PEN, +c.USD, +c.eq ]));

  const resumen = [['Periodo','Ingresos S/','Gastos fijos S/','Gastos variables S/','Te queda S/ (equivalente)']];
  availablePeriodKeys('mes').slice().sort().forEach(mk=>{
    const pd = periodData(mk,'mes');
    resumen.push([ periodLabel(mk,'mes'), +pd.ingresoEqTotal, +round2(pd.bucketsPEN.fijo+pd.bucketsUSD.fijo*STATE.settings.fx),
      +round2(pd.bucketsPEN.variable+pd.bucketsUSD.variable*STATE.settings.fx), +pd.teQueda ]);
  });

  return [
    { nombre:'Resumen', filas:resumen },
    { nombre:'Por categoría', filas:porCategoria },
    { nombre:'Movimientos', filas:movimientos },
    { nombre:'Ingresos', filas:ingresos },
    { nombre:'Compromisos', filas:compromisos },
    { nombre:'Deudas', filas:deudas },
    { nombre:'CT adelantos', filas:ctAdel },
    { nombre:'CT reembolsos', filas:ctReemb },
    { nombre:'Ahorros', filas:ahorros },
    { nombre:'Préstamos', filas:prestamos },
  ];
}
function descargarExcel(){
  try{
    const bytes = construirXLSX(hojasDeDatos());
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Brote-finanzas-'+TODAY+'.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    showToast('Excel descargado');
  }catch(e){ showToast('No pude generar el Excel'); }
}
/* ---- Crear / editar compromiso fijo (incluye duración) ---- */
function sheetEditarCompromiso(id){
  const cm = id ? STATE.commitments.find(c=>c.id===id) : null;
  let html = '<h2>'+(cm?'Editar compromiso':'Nuevo compromiso fijo')+'</h2>';
  html += '<label class="field"><span class="lt">Nombre</span><input type="text" id="cmName" value="'+esc(cm?cm.name:'')+'"></label>';
  html += '<div class="grid2"><label class="field"><span class="lt">Monto</span><input type="number" step="0.01" id="cmMonto" value="'+(cm?cm.amount:'')+'"></label>';
  html += '<label class="field"><span class="lt">Moneda</span><select id="cmMoneda"><option value="PEN" '+(!cm||cm.currency==='PEN'?'selected':'')+'>Soles (S/)</option><option value="USD" '+(cm&&cm.currency==='USD'?'selected':'')+'>Dólares ($)</option></select></label></div>';
  html += '<div class="grid2"><label class="field"><span class="lt">Día de cobro</span><input type="number" min="1" max="31" id="cmDia" value="'+(cm?cm.dueDay:1)+'"></label>';
  html += '<label class="field"><span class="lt">Frecuencia</span><select id="cmFreq"><option value="mensual" '+(!cm||cm.freq==='mensual'?'selected':'')+'>Mensual</option><option value="anual" '+(cm&&cm.freq==='anual'?'selected':'')+'>Anual</option></select></label></div>';
  html += '<div class="eyebrow" style="margin-top:12px">Categoría</div>';
  html += catPickerHTML('cm', cm?cm.category:'otros');
  html += '<label class="field"><span class="lt">¿Se cobra solo (autopay) o lo pagas tú?</span><select id="cmAutopay"><option value="1" '+(!cm||cm.autopay?'selected':'')+'>Automático (tarjeta/débito)</option><option value="0" '+(cm&&!cm.autopay?'selected':'')+'>Manual (yo lo pago)</option></select></label>';

  html += '<div class="eyebrow" style="margin-top:14px">Duración — cuánto tiempo dura este gasto fijo</div>';
  const endMode = cm ? cm.endMode : 'indefinido';
  html += '<div class="seg" id="cmDuracion">';
  html += '<button data-v="indefinido" class="'+(endMode==='indefinido'?'active':'')+'" onclick="segPick(this);cmDuracionChanged()">Sin fin</button>';
  html += '<button data-v="hasta" class="'+(endMode==='hasta'?'active':'')+'" onclick="segPick(this);cmDuracionChanged()">Hasta un mes</button>';
  html += '<button data-v="ocurrencias" class="'+(endMode==='ocurrencias'?'active':'')+'" onclick="segPick(this);cmDuracionChanged()">N.º de pagos</button>';
  html += '</div>';
  html += '<div id="cmDuracionExtra" style="margin-top:8px">';
  if(endMode==='hasta') html += '<input type="text" id="cmHasta" placeholder="YYYY-MM" value="'+(cm&&cm.endValue||'')+'">';
  else if(endMode==='ocurrencias') html += '<input type="number" id="cmOcurrencias" placeholder="Cantidad de pagos" value="'+(cm&&cm.occurrencesTotal||'')+'">';
  html += '</div>';

  html += '<button class="btn primary" style="margin-top:16px" onclick="guardarCompromiso(\''+(id||'')+'\')">Guardar</button>';
  if(cm){
    html += '<div class="grid2" style="margin-top:8px">';
    html += '<button class="btn ghost" onclick="pausarCompromiso(\''+id+'\')">'+(cm.active?'Pausar':'Reactivar')+'</button>';
    html += '<button class="btn ghost" onclick="saltarMesCompromiso(\''+id+'\')">Saltar este mes</button>';
    html += '</div>';
    html += '<button class="btn danger" style="margin-top:8px" onclick="darDeBajaCompromiso(\''+id+'\')">Dar de baja</button>';
  }
  return html;
}
function cmDuracionChanged(){
  const v = document.querySelector('#cmDuracion .active').dataset.v;
  const box = document.getElementById('cmDuracionExtra');
  if(v==='hasta') box.innerHTML = '<input type="text" id="cmHasta" placeholder="YYYY-MM">';
  else if(v==='ocurrencias') box.innerHTML = '<input type="number" id="cmOcurrencias" placeholder="Cantidad de pagos">';
  else box.innerHTML = '';
}
function guardarCompromiso(id){
  const name = document.getElementById('cmName').value.trim();
  const amount = parseFloat(document.getElementById('cmMonto').value);
  const currency = document.getElementById('cmMoneda').value;
  const dueDay = parseInt(document.getElementById('cmDia').value,10);
  const freq = document.getElementById('cmFreq').value;
  const category = catPickerValue('cm');
  const autopay = document.getElementById('cmAutopay').value==='1';
  const endMode = document.querySelector('#cmDuracion .active').dataset.v;
  if(!name || !amount || !dueDay){ showToast('Completa nombre, monto y día'); return; }
  let extra = {};
  if(endMode==='hasta'){
    const v = document.getElementById('cmHasta').value.trim();
    if(!/^\d{4}-\d{2}$/.test(v)){ showToast('Formato de mes: YYYY-MM'); return; }
    extra.endValue = v;
  } else if(endMode==='ocurrencias'){
    const n = parseInt(document.getElementById('cmOcurrencias').value,10);
    if(!n){ showToast('Indica cuántos pagos'); return; }
    extra.occurrences = n; extra.occurrencesTotal = n;
  }
  let cm = id ? STATE.commitments.find(c=>c.id===id) : null;
  if(cm){
    Object.assign(cm, { name, amount:round2(amount), currency, dueDay, freq, category, autopay, endMode, ...extra });
    if(endMode!=='ocurrencias'){ delete cm.occurrences; delete cm.occurrencesTotal; }
    if(endMode!=='hasta') delete cm.endValue;
  } else {
    STATE.commitments.push({ id: uid('cm'), name, amount:round2(amount), currency, dueDay, freq,
      intervalMonths:1, anchorMonth: ymOf(TODAY), category, autopay, active:true, endMode, ...extra });
  }
  saveState(); closeSheet(); showToast('Guardado'); render();
}
function pausarCompromiso(id){
  const cm = STATE.commitments.find(c=>c.id===id); if(!cm) return;
  cm.active = !cm.active; // pausar/reactivar — nunca borra el compromiso
  saveState(); closeSheet(); showToast(cm.active?'Reactivado':'Pausado'); render();
}
function saltarMesCompromiso(id){
  const cm = STATE.commitments.find(c=>c.id===id); if(!cm) return;
  const mk = currentPeriodKey();
  cm.skippedMonths = cm.skippedMonths || [];
  if(!cm.skippedMonths.includes(mk)) cm.skippedMonths.push(mk);
  saveState(); closeSheet(); showToast('Saltado este mes'); render();
}
function darDeBajaCompromiso(id){
  if(!confirm('¿Dar de baja este compromiso? Se pausa para siempre pero no se borra el historial.')) return;
  const cm = STATE.commitments.find(c=>c.id===id); if(!cm) return;
  cm.active = false; cm.bajaEl = TODAY;
  saveState(); closeSheet(); showToast('Dado de baja'); render();
}

/* ---- Registrar pago de un préstamo a terceros ---- */
function sheetPagoPrestamo(id){
  const l = STATE.loans.find(x=>x.id===id);
  if(!l) return '<div class="empty">No encontrado.</div>';
  const bal = loanBalance(l);
  const esMeDebe = l.dir==='preste';
  let html = '<h2>Registrar pago</h2>';
  html += '<div class="txn-meta" style="margin-bottom:10px">'+esc(l.persona)+' · '+(esMeDebe?'te debe':'le debes')+' '+fmtMoney(bal,l.currency)+'</div>';
  html += '<label class="field"><span class="lt">Monto ('+l.currency+')</span><input type="number" step="0.01" id="pgMonto" value="'+bal+'"></label>';
  html += '<label class="field"><span class="lt">Fecha</span><input type="date" id="pgFecha" value="'+TODAY+'"></label>';
  html += '<div class="txn-meta" style="margin-top:8px">'+(esMeDebe?'Esto se suma a tus ingresos.':'Esto se suma a tus gastos variables.')+'</div>';
  html += '<button class="btn primary" style="margin-top:14px" onclick="guardarPagoPrestamo(\''+id+'\')">Guardar</button>';
  return html;
}
function guardarPagoPrestamo(id){
  const l = STATE.loans.find(x=>x.id===id); if(!l) return;
  const monto = parseFloat(document.getElementById('pgMonto').value);
  const fecha = document.getElementById('pgFecha').value;
  if(!monto || monto<=0){ showToast('Ingresa un monto válido'); return; }
  const esMeDebe = l.dir==='preste';
  const t = {
    id: uid('pago'), date: fecha, merchant: l.persona, alias: (esMeDebe?'Pago de ':'Pago a ')+l.persona,
    amount: round2(monto), currency: l.currency, category: 'prestamos',
    type: esMeDebe ? 'ingreso' : 'egreso', linkId: l.id, source: 'pago-prestamo'
  };
  STATE.txns.push(t);
  runMigrations(); saveState(); closeSheet(); showToast('Pago registrado'); render();
}
</script>

<script type="module">
/* ============ NUBE (Firebase) — opcional, solo si llenaste FIREBASE_CONFIG ============
   Si FIREBASE_CONFIG.apiKey está vacío, este bloque no hace nada y Brote funciona
   exactamente igual que dentro de Claude (solo local, sin login). */
(async function(){
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey) return;

  let lockHost = null;
  function showLock(kind){
    if(!lockHost){ lockHost = document.createElement('div'); document.body.appendChild(lockHost); }
    let inner = '<div class="cloud-lock"><div class="box">';
    inner += '<div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h9"/><path d="M12.5 20V11"/><path d="M12.5 11C12.5 6 9.5 3 4 3c0 4 2.5 7 8.5 8z"/><path d="M12.5 8.5C12.5 3.7 15.7 1 21 1c0 4-2.5 7-8.5 7.5z"/></svg> Brote</div>';
    if(kind==='noAutorizado'){
      inner += '<div class="warn">Esta cuenta de Google no tiene acceso a estos datos. Entra con la cuenta correcta.</div>';
      inner += '<button onclick="window.__broteSignIn()">Entrar con otra cuenta</button>';
    } else {
      inner += '<p>Tus datos están protegidos. Entra con tu cuenta de Google para verlos y sincronizarlos entre tus dispositivos.</p>';
      inner += '<button onclick="window.__broteSignIn()">Entrar con Google</button>';
    }
    inner += '</div></div>';
    lockHost.innerHTML = inner;
  }
  function hideLock(){ if(lockHost){ lockHost.remove(); lockHost = null; } }

  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    const authMod = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
    const app = appMod.initializeApp(cfg);
    const auth = authMod.getAuth(app);
    const db = fsMod.getFirestore(app);
    const provider = new authMod.GoogleAuthProvider();

    let currentUser = null, unsub = null, applyingRemote = false, pushTimer = null;

    function schedulePush(){
      if(applyingRemote) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushNow, 1500);
    }
    async function pushNow(){
      if(!currentUser) return;
      try{ await fsMod.setDoc(fsMod.doc(db,'users',currentUser.uid,'data','state'), window.getFullState()); }
      catch(e){ console.error('Brote nube: no pude subir', e); }
    }

    window.__broteSignIn = ()=>{
      authMod.signInWithPopup(auth, provider).catch(e=>{
        if(window.showToast) window.showToast('No se pudo entrar: '+e.message);
      });
    };
    window.BroteCloud = {
      status(){ return currentUser ? ('Conectada como '+currentUser.email+'. Se sincroniza sola entre tus dispositivos.') : 'No has entrado con Google todavía.'; },
      isSignedIn(){ return !!currentUser; },
      signIn(){ window.__broteSignIn(); },
      signOut(){ authMod.signOut(auth); }
    };

    authMod.onAuthStateChanged(auth, (user)=>{
      if(unsub){ unsub(); unsub=null; }
      if(user && user.email === window.CORREO_PERMITIDO){
        currentUser = user;
        hideLock();
        window.__onStateSaved = schedulePush;
        unsub = fsMod.onSnapshot(fsMod.doc(db,'users',user.uid,'data','state'), (snap)=>{
          if(snap.exists()){
            applyingRemote = true;
            window.mergeImport(snap.data(), 'combinar', true);
            applyingRemote = false;
          } else {
            pushNow();
          }
          if(window.render) window.render();
        }, (err)=>{ console.error('Brote nube: error escuchando', err); });
      } else if(user){
        currentUser = null;
        window.__onStateSaved = null;
        showLock('noAutorizado');
      } else {
        currentUser = null;
        window.__onStateSaved = null;
        showLock('entrar');
      }
    });
  }catch(e){
    console.error('Brote nube: no se pudo inicializar Firebase', e);
  }
})();
</script>
